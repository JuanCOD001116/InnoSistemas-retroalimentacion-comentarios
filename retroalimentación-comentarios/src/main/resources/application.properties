spring.application.name=retroalimentacion-y-comentarios

# DataSource (override with ENV in prod)
spring.datasource.url=${DB_URL:jdbc:postgresql://db:5432/InnosistemasDB}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root1}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# WebSocket CORS
app.websocket.allowed-origins=${WS_ALLOWED_ORIGINS:*}

# Security toggle for local dev
app.security.enabled=${SECURITY_ENABLED:true}
app.security.jwt-public-key-pem=${JWT_PUBLIC_KEY:}

# JWT local por defecto (HS256)
jwt.secret=${JWT_SECRET:u1nX1mP4hN2aR8q3v6yZb0c+fQjLwS1eP7r9t2x5a8k=}
jwt.exp-minutes=${JWT_EXP_MINUTES:60}

# Swagger OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# Excluir clases ControllerAdvice problemáticas del escaneo
springdoc.paths-to-exclude=/error

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
